<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>funnel.ai</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1>funnel.ai</h1>
          <p id="status">Setup required.</p>
        </div>

        <section class="top-actions">
          <button id="clearSummaryBtn" class="secondary-button" type="button">
            Clear
          </button>

          <button id="clearKeyBtn" class="secondary-button danger-button" type="button">
            Delete Key
          </button>

          <button id="settingsBtn" class="icon-button" type="button" aria-label="Settings" title="Settings">
            &#9881;
          </button>
        </section>
      </header>

      <section id="setupView" class="card">
        <div class="form-group">
          <label for="providerSelect">AI provider</label>
          <select id="providerSelect">
            <option value="openai">OpenAI / ChatGPT</option>
            <option value="gemini">Google Gemini</option>
            <option value="anthropic">Anthropic Claude</option>
          </select>
        </div>

        <div class="form-group">
          <label for="apiKeyInput">API key</label>
          <div id="apiKeySavedNote" class="saved-note" hidden>
            API key saved. Leave blank to keep it.
          </div>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="Paste your API key"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="modelInput">Model</label>
          <input
            id="modelInput"
            type="text"
            placeholder="e.g. gpt-4.1-mini"
            autocomplete="off"
          />
        </div>

        <button id="saveSettingsBtn" type="button">
          Save settings
        </button>

        <p class="hint">
          Your API key is stored locally in Chrome and is only used to send
          requests to the selected AI provider.
        </p>
      </section>

      <section id="summaryView" hidden>
        <section class="summary-meta" id="summaryMeta" hidden>
          <div>
            <span>Page</span>
            <strong id="summaryUrl"></strong>
          </div>

          <div>
            <span>Created</span>
            <strong id="summaryTimestamp"></strong>
          </div>
        </section>

        <section class="summary-card">
          <button id="copySummaryBtn" class="copy-button" type="button" aria-label="Copy summary" title="Copy summary">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="9" y="3" width="11" height="11" rx="2"></rect>
              <rect x="4" y="8" width="11" height="11" rx="2"></rect>
            </svg>
          </button>
          <pre id="summaryOutput">Click Summarize to analyze the current page.</pre>
        </section>

        <section class="meta">
          <div>
            <span>Extracted characters</span>
            <strong id="charCount">0</strong>
          </div>

          <button id="summarizeBtn" type="button">
            Summarize
          </button>
        </section>
      </section>
    </main>

    <script type="module" src="scripts/sidepanel.js"></script>
  </body>
</html>
