<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>funnel.ai</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <h1>funnel.ai</h1>
        <p id="status">Setup required.</p>
      </header>

      <section id="setupView" class="card">
        <div class="form-group">
          <label for="providerSelect">AI provider</label>
          <select id="providerSelect">
            <option value="openai">OpenAI / ChatGPT</option>
            <option value="gemini">Google Gemini</option>
            <option value="anthropic">Anthropic Claude</option>
          </select>
        </div>

        <div class="form-group">
          <label for="apiKeyInput">API key</label>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="Paste your API key"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="modelInput">Model</label>
          <input
            id="modelInput"
            type="text"
            placeholder="e.g. gpt-4.1-mini"
            autocomplete="off"
          />
        </div>

        <button id="saveSettingsBtn" type="button">
          Save settings
        </button>

        <p class="hint">
          Your API key is stored locally in Chrome and is only used to send
          requests to the selected AI provider.
        </p>
      </section>

      <section id="summaryView" hidden>
        <section class="summary-card">
          <pre id="summaryOutput">Analyzing current page...</pre>
        </section>

        <section class="meta">
          <div>
            <span>Extracted characters</span>
            <strong id="charCount">0</strong>
          </div>

          <button id="retryBtn" type="button">
            Reload
          </button>
        </section>

        <section class="actions">
          <button id="settingsBtn" type="button">
            Settings
          </button>

          <button id="clearKeyBtn" type="button">
            Delete API key
          </button>
        </section>
      </section>
    </main>

    <script src="scripts/popup.js"></script>
  </body>
</html>
